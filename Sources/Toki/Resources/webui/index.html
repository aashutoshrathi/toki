<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Remote Control</title><link rel="stylesheet" href="styles.css"></head><body class="locked">
<div id="pairing">
  <form id="pairform">
    <h2>Verify this device</h2>
    <p>Enter the six-digit code shown by Toki on your Mac.</p>
    <input id="paircode" inputmode="numeric" pattern="[0-9 ]{6,7}" maxlength="7"
           autocomplete="one-time-code" placeholder="000 000" aria-label="Verification code">
    <button type="submit">Connect</button>
    <div id="pairstatus"></div>
    <small>The companion site only serves this interface. Your agent data stays on your Mac and travels directly over your network.</small>
  </form>
</div>
<header><h1><svg width="24" height="24" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" aria-label="Toki"><rect width="1024" height="1024" rx="232" fill="#181a1f"/><g transform="translate(0 6)"><path d="M268 245H704L682 282L704 319H268C248 319 232 303 232 282C232 261 248 245 268 245Z" fill="#f4f1ea"/><path d="M520 600L636 484" fill="none" stroke="#f4f1ea" stroke-width="74" stroke-linecap="round" stroke-linejoin="round"/><path d="M465 354H539V626C539 664 558 671 600 671H704L684 708L704 745H566C502 745 465 708 465 636Z" fill="#f4f1ea"/><circle cx="502" cy="282" r="96" fill="#f4f1ea"/><circle cx="502" cy="282" r="48" fill="#181a1f"/><circle cx="746" cy="282" r="39" fill="#9bb5a7"/><circle cx="636" cy="484" r="39" fill="#f4f1ea"/><circle cx="744" cy="708" r="38" fill="#d3a45c"/></g></svg>Remote Control</h1><div id="dd"><button id="ddbtn" type="button"></button><div id="ddlist"></div></div></header>
<div id="alert"></div><div id="log"></div>
<footer>
  <div class="keys">
    <button data-key="up">&#8593;</button><button data-key="down">&#8595;</button>
    <button data-key="tab">&#8677;</button><button data-key="enter">&#9166;</button>
    <button data-key="esc">esc</button>
    <button data-text="1">1</button><button data-text="2">2</button><button data-text="3">3</button>
  </div>
  <div class="row"><input id="msg" placeholder="Reply to the agent&#8230;">
  <button id="send">Send</button></div>
  <div id="status"></div>
</footer>
<script src="markdown.js"></script><script src="app.js"></script></body></html>
