name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          # The cross-version test reads the previously released companion server out of git, so
          # a shallow clone would silently skip half of it.
          fetch-depth: 0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Test companion server
        run: python3 -m unittest discover -s Tests -p 'test_*.py'
      - name: Test companion app
        run: for test in Tests/test_*.js; do node "$test"; done
